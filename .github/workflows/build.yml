name: Build
on: [push]
jobs:
    build: 
        name: Build
        runs-on: windows-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v2
              name: Checkout code
            
            - name: Setup dotnet 
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: '8.x'
            
            - name: Setup MSBuild Path
              uses: microsoft/Setup-MSBuild@v1.0.3
            
            - name: Setup NuGet
              uses: NuGet/setup-nuget@v1.0.5
            
            - name: Query nuget folders(figure out where nunit.consolerunner is stored)
              run: nuget locals global-packages -list
           
            - name: Restore NuGet Packages
              run: nuget restore TimeSeriesAnalysis.sln
           
            - name: Build 
              run: dotnet build TimeSeriesAnalysis.sln -c Release
            
            - name: Pack
              run: dotnet pack TimeSeriesAnalysis.sln -c Release --include-symbols -p:SymbolPackageFormat=snupkg --include-source
            
            - name: NuGet login (trusted publishing)
              uses: NuGet/login@v1
              id: login
              with:
                user: steinelg
                    
            - name: Nuget on Github publish 
              run: nuget push bin\Release\*.nupkg -source https://api.nuget.org/v3/index.json -SkipDuplicate  -ApiKey ${{ steps.login.outputs.NUGET_API_KEY }}


                
